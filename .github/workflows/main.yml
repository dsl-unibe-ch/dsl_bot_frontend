name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'master', 'testenv']
  workflow_dispatch:
env:
  PUBLIC_API: ${{ vars.PUBLIC_API }}

jobs:
  build_site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # If you're using pnpm, add this step then change the commands and cache key below to use `pnpm`
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Debug PUBLIC_API
        run: |
          echo "PUBLIC_API=$PUBLIC_API"

      - name: build
        env:
          NODE_OPTIONS: '--max_old_space_size=9000'
        run: |
          # testenv keeps the default GitHub Pages project path; main/master serve from a custom domain at the root.
          if [ "${{ github.ref_name }}" = "testenv" ]; then
            export BASE_PATH="/${{ github.event.repository.name }}"
          else
            export BASE_PATH=""
          fi
          echo "Using BASE_PATH=$BASE_PATH"
          pnpm run build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          # this should match the `pages` option in your adapter-static options
          path: 'build/'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
